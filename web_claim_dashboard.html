<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co https:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>KLAIM BONUS SCATTER BANDAR 80</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --ink:#f5ecd9;--soft:#d9cdb4;--muted:#b3a68c;
    --gold:#d8b45a;--gold2:#e8c96a;
    --line:rgba(216,180,90,.30);--line2:rgba(216,180,90,.42);
    --green:#57c98d;--red:#ef6a6a;--amber:#f0b82e;--blue:#8db0f2;
  }
  html,body{height:100%;}
  body{font-family:'Inter',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
    background-color:#0b0a08;
    background-image:url('messageImage_1787629523742.jpg');
    background-size:contain;background-position:center;background-repeat:no-repeat;background-attachment:fixed;}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(165deg,rgba(9,8,6,.90),rgba(11,9,7,.80) 45%,rgba(13,11,8,.84) 65%,rgba(8,7,5,.94));}
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 40%,transparent 45%,rgba(0,0,0,.5));}
  .wrap{position:relative;z-index:1;max-width:840px;margin:0 auto;padding:30px 20px 46px;}

  .shift{opacity:0;transform:translateY(12px);animation:rise .6s cubic-bezier(.22,.61,.36,1) forwards;}
  @keyframes rise{to{opacity:1;transform:none;}}
  header{display:flex;align-items:center;gap:18px;}
  .crest{position:relative;width:58px;height:58px;flex:none;border-radius:50%;
    display:grid;place-items:center;cursor:default;
    background:radial-gradient(circle at 30% 25%,#3a2f14,#0e0b06 72%);
    border:1px solid var(--line2);
    box-shadow:0 0 0 6px rgba(216,180,90,.06),0 0 24px rgba(216,180,90,.18),inset 0 0 14px rgba(216,180,90,.14);
    font-family:'Cinzel',serif;font-weight:900;font-size:21px;letter-spacing:1px;color:var(--gold2);}
  .crest::after{content:"";position:absolute;inset:4px;border:1px dashed rgba(216,180,90,.34);border-radius:50%;}
  .brand small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.34em;color:var(--gold);text-transform:uppercase;margin-bottom:4px;}
  .brand h1{font-family:'Cinzel',serif;font-weight:700;font-size:23px;letter-spacing:.05em;color:var(--ink);line-height:1.04;}
  .brand p{font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-top:5px;}
  header .spacer{flex:1;}
  @media(max-width:640px){header{flex-wrap:wrap;gap:10px;}header .spacer{display:none;}}

  nav{display:inline-flex;position:relative;margin:24px 0 18px;padding:4px;gap:4px;
    background:rgba(10,9,7,.88);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);}
  nav button{position:relative;z-index:1;border:none;background:transparent;color:var(--muted);
    font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    padding:11px 26px;border-radius:9px;cursor:pointer;transition:color .25s;}
  nav button.active{color:var(--ink);}
  nav .thumb{position:absolute;top:4px;left:4px;height:calc(100% - 8px);border-radius:9px;transition:left .34s cubic-bezier(.22,.61,.36,1);}
  nav[data-tab="claim"] .thumb{left:4px;}
  nav[data-tab="arsip"] .thumb{left:calc(50% + 2px);}
  .t-f{width:calc(50% - 2px);background:linear-gradient(180deg,rgba(216,180,90,.26),rgba(216,180,90,.08));border:1px solid var(--line2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 18px rgba(216,180,90,.14);}
  nav button .n{font-size:9px;display:inline-block;margin-left:7px;letter-spacing:.1em;color:var(--muted);}
  nav button.active .n{color:var(--gold);}

  .views{position:relative;}
  .view{display:none;}
  .view.active{display:block;animation:viewIn .45s cubic-bezier(.22,.61,.36,1);}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card{position:relative;background:linear-gradient(180deg,rgba(20,17,12,.90),rgba(11,9,7,.95));
    border:1px solid var(--line);border-radius:16px;padding:24px 26px 26px;
    box-shadow:0 24px 56px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(7px);}
  .card::before,.card::after{content:"";position:absolute;width:34px;height:34px;pointer-events:none;}
  .card::before{top:-1px;left:-1px;border-top:3px solid var(--gold);border-left:3px solid var(--gold);border-top-left-radius:16px;}
  .card::after{bottom:-1px;right:-1px;border-bottom:3px solid rgba(216,180,90,.6);border-right:3px solid rgba(216,180,90,.6);border-bottom-right-radius:16px;}
  .kicker{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .kicker .hr{height:1px;flex:1;background:linear-gradient(90deg,var(--line2),transparent);}
  .kicker span{font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase;white-space:nowrap;}

  .frow{display:flex;flex-direction:column;gap:16px;}
  .field{display:flex;flex-direction:column;gap:7px;}
  label{font-size:10px;font-weight:800;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;}
  label small{letter-spacing:.05em;text-transform:none;font-weight:500;}
  input,select{width:100%;background:rgba(15,13,10,.9);border:1px solid var(--line);border-radius:11px;color:var(--ink);
    padding:13px 14px;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s;}
  input::placeholder{color:#7d7260;}
  input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,180,90,.14),0 0 22px rgba(216,180,90,.08);}
  select option{background:#14110c;color:var(--ink);}
  .money{position:relative;}
  .money .cur{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--gold);pointer-events:none;font-family:'Inter',sans-serif;}
  .money input{padding-left:42px;}
  .scatter{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .scatter button{position:relative;overflow:hidden;border:1px solid var(--line);background:rgba(15,13,10,.9);color:var(--soft);
    border-radius:11px;padding:13px 8px;font-family:'Cinzel',serif;font-weight:700;font-size:15px;cursor:pointer;transition:all .18s;}
  .scatter button small{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-top:2px;letter-spacing:.14em;}
  .scatter button:hover{border-color:var(--line2);transform:translateY(-1px);}
  .scatter button.sel{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 3px rgba(216,180,90,.14),0 6px 20px rgba(0,0,0,.4);}
  .scatter button.sel small{color:var(--gold);}
  .act{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap;}
  .btn{position:relative;overflow:hidden;border:none;cursor:pointer;
    font-family:'Cinzel',serif;font-weight:900;font-size:13px;letter-spacing:.24em;text-transform:uppercase;
    padding:16px 30px;border-radius:12px;color:#1c1404;
    background:linear-gradient(160deg,var(--gold2),var(--gold) 55%,#b98f2e);
    box-shadow:0 8px 30px rgba(216,180,90,.28),inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .16s,box-shadow .25s;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(216,180,90,.4),inset 0 1px 0 rgba(255,255,255,.45);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .btn .shine{position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);}
  .btn:hover .shine{animation:shine .8s ease;}
  @keyframes shine{to{left:120%;}}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);box-shadow:none;
    font-size:11px;letter-spacing:.2em;padding:15px 22px;}
  .btn.ghost:hover{color:var(--ink);border-color:var(--line2);box-shadow:none;}
  .hint{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.8;letter-spacing:.02em;}
  .hint b{color:var(--gold);font-weight:800;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120%);z-index:40;
    background:rgba(13,11,8,.97);border:1px solid var(--line2);border-radius:12px;
    padding:13px 20px;font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:.03em;
    box-shadow:0 14px 44px rgba(0,0,0,.6);backdrop-filter:blur(8px);
    transition:transform .4s cubic-bezier(.22,.61,.36,1);max-width:min(90vw,560px);text-align:center;}
  .toast.show{transform:translate(-50%,0);}
  .toast.ok{border-color:rgba(87,201,141,.55);} .toast.ok::before{content:"✓ ";}
  .toast.bad{border-color:rgba(239,106,106,.55);} .toast.bad::before{content:"✗ ";}
  .toast.info::before{content:"— ";}

  /* arsip: list ke bawah, tidak melebar ke samping */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat{background:rgba(15,13,10,.82);border:1px solid var(--line);border-radius:13px;padding:14px 16px;position:relative;overflow:hidden;}
  .stat::after{content:"";position:absolute;right:-14px;top:-14px;width:52px;height:52px;border-radius:50%;background:rgba(216,180,90,.08);}
  .stat b{display:block;font-family:'Cinzel',serif;font-weight:700;font-size:21px;color:var(--ink);letter-spacing:.02em;}
  .stat span{font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
  .stat.g b{color:var(--green);}.stat.r b{color:var(--red);}.stat.a b{color:var(--gold2);}.stat.t b{color:var(--soft);}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar .ih{flex:1;min-width:200px;}
  .toolbar input{padding:11px 14px;font-size:12.5px;}
  select.mini{padding:11px 12px;font-size:12px;width:auto;}

  .rows{display:flex;flex-direction:column;gap:10px;}
  .row{background:rgba(16,13,10,.86);border:1px solid var(--line);border-left:3px solid var(--gold);
    border-radius:12px;padding:13px 16px;transition:transform .15s,box-shadow .2s;animation:rowIn .3s cubic-bezier(.22,.61,.36,1);}
  @keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,.4);}
  .row .rt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .row .who{font-weight:800;font-size:13.5px;color:var(--ink);letter-spacing:.02em;}
  .row .time{margin-left:auto;font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;}
  .row .rm{margin-top:8px;font-family:'Inter',monospace;font-size:12px;letter-spacing:.04em;color:var(--soft);
    background:rgba(216,180,90,.07);border:1px dashed rgba(216,180,90,.22);border-radius:8px;padding:7px 10px;
    word-break:break-all;display:inline-block;}
  .row .rm b{color:var(--gold);font-weight:700;}
  .row .rg{display:flex;gap:26px;margin-top:9px;flex-wrap:wrap;}
  .row .kv{display:inline-flex;align-items:baseline;gap:7px;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:700;}
  .row .kv b{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink);font-weight:800;text-transform:none;letter-spacing:0;}
  .row .kv b.act{color:var(--gold);}
  .row .rd{margin-top:8px;font-size:12px;color:var(--soft);line-height:1.55;letter-spacing:.02em;}
  .row .rd.g{color:var(--green);}.row .rd.r{color:#ffb0b0;}.row .rd.a{color:var(--gold);}

  .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
    font-size:10px;font-weight:900;letter-spacing:.1em;white-space:nowrap;border:1px solid transparent;
    animation:stampIn .32s cubic-bezier(.22,.8,.3,1.2);transform-origin:center;}
  @keyframes stampIn{from{transform:scale(1.25) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
  .tag i{width:5px;height:5px;border-radius:50%;background:currentColor;}
  .tag.x3-5{background:rgba(240,184,46,.92);color:#241a04;}
  .tag.pul{background:rgba(141,176,242,.95);color:#0c1730;}
  .tag.vrf{background:rgba(216,180,90,.95);color:#241a04;}
  .tag.ok{background:rgba(87,201,141,.95);color:#052016;}
  .tag.gagal{background:rgba(239,106,106,.95);color:#2b0606;}
  .tag.err{background:rgba(255,143,143,.98);color:#2b0606;}
  .tag.act{animation:throbPulse 1.25s ease-in-out infinite;}
  @keyframes throbPulse{0%,100%{opacity:1}50%{opacity:.6}}

  .empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:.05em;
    border:1px dashed var(--line);border-radius:12px;background:rgba(14,12,9,.6);}
  .empty b{display:block;font-family:'Cinzel',serif;color:var(--soft);font-size:14px;letter-spacing:.18em;margin-bottom:8px;text-transform:uppercase;}
  .foot{margin-top:30px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
    font-size:10px;color:#8d816c;letter-spacing:.14em;border-top:1px solid rgba(216,180,90,.14);padding-top:16px;}
  .foot b{color:var(--gold);}

  @media(max-width:900px){body{background-position:center 0;} .row .rg{gap:16px;}}

  /* responsif: tablet & HP */
  @media(max-width:640px){
    .wrap{width:100%;padding:20px 12px 36px;}
    header{gap:10px;}
    .brand h1{font-size:20px;}
    .brand p{font-size:10.5px;}
    nav{width:100%;}
    nav button{flex:1;padding:11px 8px;font-size:11px;letter-spacing:.12em;}
    .card{padding:20px 16px 22px;border-radius:14px;}
    .stats{grid-template-columns:repeat(2,1fr);gap:10px;}
    .stat{padding:12px 14px;}
    .stat b{font-size:18px;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .toolbar .ih{min-width:0;}
    select.mini{width:100%;}
    input,select{font-size:16px;}
    .act .btn{flex:1;min-width:0;}
    .row .rm{font-size:11px;}
    .foot{margin-top:22px;flex-direction:column;align-items:flex-start;}
  }

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  .fix{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(216,180,90,.25);}
  .fix input{flex:1 1 130px;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--soft);font-size:12px;outline:none;}
  .fix input:focus{border-color:var(--gold);}
  .fix button{padding:8px 14px;border-radius:8px;border:0;background:var(--gold);color:#241a04;font-weight:900;font-size:11px;letter-spacing:.06em;cursor:pointer;}
  .fix button:disabled{opacity:.5;}
</style>
</head>
<body>
<div class="wrap">
  <header class="shift" style="animation-delay:.02s">
    <div class="crest">B</div>
    <div class="brand">
      <small>Sistem Pelayanan Klaim</small>
      <h1>KLAIM BONUS SCATTER BANDAR 80</h1>
    </div>
    <div class="spacer"></div>
  </header>

  <nav id="nav" data-tab="claim" class="shift" style="animation-delay:.08s">
    <div class="thumb t-f"></div>
    <button class="tabbtn active" data-tab="claim">Form Klaim</button>
    <button class="tabbtn" data-tab="arsip">Hasil &amp; Arsip<i class="n" id="arsipCount">0</i></button>
  </nav>

  <section id="view-claim" class="view active">
    <div class="card">
      <div class="kicker"><span>Surat Klaim</span><div class="hr"></div></div>
      <input type="text" id="f_bot" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;height:1px;width:1px;opacity:0">
      <div class="frow">
        <div class="field">
          <label>Situs</label>
          <select id="f_site"><option value="">Memuat situs...</option></select>
        </div>
        <div class="field">
          <label>User ID</label>
          <input id="f_user" placeholder="hokiudore" autocomplete="off" maxlength="64">
        </div>
        <div class="field">
          <label>Kode Tiket <small>(transaction ID)</small></label>
          <input id="f_tx" placeholder="2081566454871960576" inputmode="numeric" autocomplete="off" maxlength="40">
        </div>
        <div class="field">
          <label>Nominal Bet</label>
          <div class="money"><span class="cur">Rp</span><input id="f_bet" placeholder="16,000" inputmode="numeric" autocomplete="off" maxlength="12"></div>
        </div>
        <div class="field">
          <label>Scatter</label>
          <div class="scatter" id="scSel">
            <button type="button" data-v="3">x3<small>TIGA</small></button>
            <button type="button" data-v="4">x4<small>EMPAT</small></button>
            <button type="button" data-v="5">x5<small>LIMA</small></button>
          </div>
        </div>
      </div>
      <div class="act">
        <button class="btn" id="btnSubmit"><span class="shine"></span>Kirim Klaim</button>
        <button class="btn ghost" id="btnClearDone">Bersihkan arsip selesai</button>
      </div>
    </div>
  </section>

  <section id="view-arsip" class="view">
    <div class="card">
      <div class="kicker"><span>Hasil &amp; Arsip</span><div class="hr"></div></div>
      <div class="stats">
        <div class="stat t"><b id="st_total">0</b><span>Total Klaim</span></div>
        <div class="stat a"><b id="st_ok">0</b><span>Berhasil Input</span></div>
        <div class="stat g"><b id="st_sesuai">0</b><span>Sesuai Verifikasi</span></div>
        <div class="stat r"><b id="st_tolak">0</b><span>Ditolak</span></div>
      </div>
      <div class="toolbar">
        <div class="ih"><input id="q" placeholder="Cari user id / kode tiket..." autocomplete="off"></div>
        <select class="mini" id="fStatus">
          <option value="">Semua status</option>
          <option value="aktif">Sedang diproses</option>
          <option value="INPUT_OK">Berhasil diinput</option>
          <option value="TIDAK_SESUAI">Tidak sesuai</option>
          <option value="INPUT_FAIL">Input gagal</option>
          <option value="ERROR">Error</option>
          <option value="ID_SALAH">Perlu cek id</option>
        </select>
      </div>
      <div class="rows" id="rows"></div>
      <div id="empty" class="empty" style="display:none"><b id="emptyT">Arsip kosong</b><em id="emptyS">Belum ada klaim masuk.</em></div>
    </div>
  </section>

  <div class="foot"></div>
</div>

<div class="toast" id="toast"></div>
<script src="sb.js"></script>
<script>
(function () {
  var claims = [], sites = {}, busy = false, scatterSel = 3, toastTimer = null;
  var $ = function (id) { return document.getElementById(id); };
  var currentTab = 'claim';

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function rupiah(v) { var n = parseInt(String(v == null ? '' : v).replace(/\D/g, ''), 10); return isNaN(n) ? '' : n.toLocaleString('id-ID'); }
  function siteLabel(id) { return (sites[id] || id || '?'); }
  function when(ts) { if (!ts) return ''; var d = new Date(ts); return d.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }

  function toast(txt, kind) {
    var t = $('toast');
    t.className = 'toast show ' + (kind || 'info');
    t.textContent = txt;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 4200);
  }
  function clearToast() { var t = $('toast'); if (t) t.classList.remove('show'); if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; } }
  function moneyTxt(n) { return Number(n).toLocaleString('en-US'); }
  var MONEY_MIN = 1600, MONEY_MAX = 1000000;
  function betDigits() { return ($('f_bet').value.match(/\d/g) || []).join(''); }

  /* navigasi tab */
  var nav = $('nav');
  function setTab(name) {
    currentTab = name;
    nav.setAttribute('data-tab', name);
    Array.prototype.forEach.call(nav.querySelectorAll('.tabbtn'), function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === name); });
    $('view-claim').classList.toggle('active', name === 'claim');
    $('view-arsip').classList.toggle('active', name === 'arsip');
    if (name === 'arsip') renderArsip();
  }
  Array.prototype.forEach.call(nav.querySelectorAll('.tabbtn'), function (b) {
    b.addEventListener('click', function () { setTab(this.getAttribute('data-tab')); });
  });

  /* scatter */
  var scBtn = Array.prototype.slice.call($('scSel').querySelectorAll('button'));
  function paintSc() { scBtn.forEach(function (b) { b.classList.toggle('sel', Number(b.getAttribute('data-v')) === scatterSel); }); }
  scBtn.forEach(function (b) { b.addEventListener('click', function () { scatterSel = Number(this.getAttribute('data-v')); paintSc(); }); });

  $('f_bet').addEventListener('input', function () {
    var d = betDigits();
    this.value = d ? moneyTxt(parseInt(d, 10)) : '';
    var n = d ? parseInt(d, 10) : 0;
    if (n > 0 && n < MONEY_MIN) { toast('Nominal bet minimal Rp ' + moneyTxt(MONEY_MIN) + '.', 'bad'); }
    else if (n > MONEY_MAX) { toast('Antara Rp ' + moneyTxt(MONEY_MIN) + ' dan Rp ' + moneyTxt(MONEY_MAX) + '.', 'bad'); }
    else { clearToast(); }
  });

  /* meta status → tampilan */
  function meta(s) {
    var m = {
      PENDING:      { cls: 'act pul', txt: 'ANTRI' },
      QUEUED:       { cls: 'act pul', txt: 'ANTRI' },
      VERIFYING:    { cls: 'act vrf', txt: 'MEMERIKSA' },
      SESUAI:       { cls: 'vrf', txt: 'SESUAI' },
      TIDAK_SESUAI: { cls: 'gagal', txt: 'TIDAK SESUAI' },
      INPUTTING:    { cls: 'act vrf', txt: 'INPUT WEB BONUS' },
      INPUT_OK:     { cls: 'ok', txt: 'BERHASIL DIINPUT' },
      INPUT_FAIL:   { cls: 'gagal', txt: 'INPUT GAGAL' },
      ERROR:        { cls: 'err', txt: 'ERROR' },
      ID_SALAH:     { cls: 'gagal', txt: 'PERLU CEK ID' },
      NO_TOKEN:     { cls: 'gagal', txt: 'TOKEN KOSONG' }
    };
    return m[s] || { cls: 'x3-5', txt: s || '?' };
  }

  function renderArsip() {
    var qv = ($('q').value || '').trim().toLowerCase();
    var fv = $('fStatus').value;
    var box = $('rows'), empty = $('empty'), frag = document.createDocumentFragment(), out = [], i, c;

    var stOk = 0, stSesuai = 0, stTolak = 0;
    for (i = 0; i < claims.length; i++) {
      c = claims[i];
      if (c.status === 'INPUT_OK') stOk++;
      if (c.match === true || c.status === 'SESUAI' || c.status === 'INPUT_OK') stSesuai++;
      if (c.status === 'TIDAK_SESUAI' || c.status === 'INPUT_FAIL' || c.status === 'ERROR') stTolak++;
    }
    $('st_total').textContent = claims.length;
    $('st_ok').textContent = stOk;
    $('st_sesuai').textContent = stSesuai;
    $('st_tolak').textContent = stTolak;
    $('arsipCount').textContent = claims.length;

    box.innerHTML = '';
    if (!claims.length) { empty.style.display = 'block'; return; }

    var act = ['PENDING', 'QUEUED', 'VERIFYING', 'SESUAI', 'INPUTTING', 'ID_SALAH'];
    var shown = 0;
    for (i = claims.length - 1; i >= 0; i--) {
      c = claims[i];
      if (qv && String(c.user_id || '').toLowerCase().indexOf(qv) < 0 && String(c.kode_tiket || '').toLowerCase().indexOf(qv) < 0) continue;
      if (fv === 'aktif') { if (act.indexOf(c.status) < 0) continue; }
      else if (fv && c.status !== fv) continue;
      shown++;

      var m = meta(c.status);
      var bet = rupiah(c.betting), betA = c.actual_bet ? rupiah(c.actual_bet) : '';
      var sc = esc(c.scatter), scA = (c.actual_scatter != null && String(c.actual_scatter) !== '') ? esc(c.actual_scatter) : '';
      var hasActual = !!(betA || scA);

      var div = document.createElement('div');
      div.className = 'row';
      div.innerHTML =
        '<div class="rt"><span class="tag ' + m.cls + '"><i></i>' + esc(m.txt) + '</span>' +
        '<span class="who">' + esc(c.user_id) + '</span>' +
        '<span class="time">' + esc(when(c.updated_at || c.created_at)) + '</span></div>' +
        '<div class="rm"><b>' + esc(siteLabel(c.site)) + '</b> · ' + esc(c.kode_tiket) + '</div>' +
        '<div class="rg">' +
          '<span class="kv">Bet <b class="' + (hasActual ? 'act' : '') + '">' + bet + '</b>' + (betA ? '<span>→ ' + betA + '</span>' : '') + '</span>' +
          '<span class="kv">Sc <b class="' + (hasActual ? 'act' : '') + '">' + sc + '</b>' + (scA ? '<span>→ ' + scA + '</span>' : '') + '</span>' +
        '</div>' +
        '<div class="rd">' + esc(c.detail || '') + '</div>' +
        ((c.status === 'ID_SALAH' || c.status === 'INPUT_FAIL' || (c.status === 'ERROR' && String(c.detail || '').indexOf('userId berbeda') >= 0)) ?
          '<div class="fix">' +
            '<input class="fxu" placeholder="User ID" value="' + esc(c.user_id) + '" autocomplete="off" maxlength="64">' +
            '<input class="fxt" placeholder="Kode Tiket" value="' + esc(c.kode_tiket) + '" inputmode="numeric" autocomplete="off" maxlength="40">' +
            '<button class="fxbtn" data-i="' + esc(c.id) + '">Cek Ulang</button>' +
          '</div>' : '');
      out.push(div);
    }

    empty.style.display = shown ? 'none' : 'block';
    for (i = 0; i < out.length; i++) frag.appendChild(out[i]);
    box.appendChild(frag);
  }

  /* muat situs aktif (dropdown + label) */
  function loadSites() {
    SB.listActiveSites().then(function (rows) {
      if (!Array.isArray(rows)) rows = [];
      sites = {};
      rows.forEach(function (r) { sites[r.site_id] = r.label; });
      var sel = $('f_site');
      sel.innerHTML = rows.map(function (r) { return '<option value="' + r.site_id + '">' + r.label + '</option>'; }).join('') ||
        '<option value="">Belum ada situs terdaftar</option>';
    }).catch(function () {});
  }

  /* ambil data klaim dari cloud */
  function poll() {
    SB.list('claims', { select: ['*'], order: 'created_at.desc', limit: '200' })
      .then(function (rows) { claims = Array.isArray(rows) ? rows : []; loadSites(); if (currentTab === 'arsip') renderArsip(); })
      .catch(function () {});
  }

  /* submit klaim (owner juga bisa) */
  var lastSubmit = 0;
  $('btnSubmit').addEventListener('click', function () {
    if (busy) return;
    var botTrap = $('f_bot');
    if (botTrap && botTrap.value) return;
    if (Date.now() - lastSubmit < 3500) { toast('Terlalu cepat, tunggu sesaat.', 'bad'); return; }
    lastSubmit = Date.now();
    var site = $('f_site').value;
    var userId = $('f_user').value.trim();
    var tx = $('f_tx').value.trim();
    var betRaw = betDigits();
    if (site.length > 64 || userId.length > 64 || tx.length > 40 || betRaw.length > 12) { toast('Data terlalu panjang.', 'bad'); return; }
    if (!site) { toast('Pilih situs tujuan dulu.', 'bad'); return; }
    if (!userId || !tx) { toast('Lengkapi User ID dan Kode Tiket.', 'bad'); return; }
    if (!betRaw) { toast('Nominal bet wajib diisi.', 'bad'); return; }
    var betNum = parseInt(betRaw, 10);
    if (betNum < MONEY_MIN) { toast('Nominal bet minimal Rp ' + moneyTxt(MONEY_MIN) + '.', 'bad'); return; }
    if (betNum > MONEY_MAX) { toast('Antara Rp ' + moneyTxt(MONEY_MIN) + ' dan Rp ' + moneyTxt(MONEY_MAX) + '.', 'bad'); return; }

    busy = true; $('btnSubmit').disabled = true;
    SB.insert('claims', {
      site: site, user_id: userId, kode_tiket: tx,
      betting: betNum, scatter: scatterSel,
      status: 'PENDING', label: 'ANTRI', detail: 'Menunggu antrian verifikasi'
    }).then(function () {
      toast('Klaim diterima — diantre untuk diverifikasi.', 'ok');
      $('f_user').value = ''; $('f_tx').value = ''; $('f_bet').value = '';
      poll();
    }).catch(function (e) {
      toast(e && e.message ? 'Gagal kirim: ' + e.message : 'Gagal mengirim klaim.', 'bad');
    }).finally(function () { busy = false; $('btnSubmit').disabled = false; });
  });

  /* bersihkan arsip selesai (hapus status final dari cloud) */
  $('btnClearDone').addEventListener('click', function () {
    var final = ['INPUT_OK', 'TIDAK_SESUAI', 'INPUT_FAIL', 'ERROR', 'NO_TOKEN'];
    var ids = claims.filter(function (c) { return c && final.indexOf(c.status) >= 0; }).map(function (c) { return c.id; });
    if (!ids.length) { toast('Tidak ada arsip selesai untuk dibersihkan.', 'info'); return; }
    Promise.all(ids.map(function (id) { return SB.remove('claims', id); }))
      .then(function () { toast(ids.length + ' arsip selesai dibersihkan.', 'ok'); poll(); })
      .catch(function () { toast('Gagal membersihkan arsip.', 'bad'); });
  });

  $('q').addEventListener('input', function () { if (currentTab === 'arsip') renderArsip(); });
  $('fStatus').addEventListener('change', function () { renderArsip(); });

  $('rows').addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('.fxbtn') : null;
    if (!btn) return;
    var id = btn.getAttribute('data-i');
    var row = btn.closest ? btn.closest('.row') : null;
    if (!id || !row) return;
    var uid = row.querySelector('.fxu').value.trim();
    var tx = row.querySelector('.fxt').value.trim();
    if (!uid || !tx) { toast('Isi User ID dan Kode Tiket dulu.', 'bad'); return; }
    btn.disabled = true;
    SB.patch('claims', id, { user_id: uid, kode_tiket: tx, status: 'PENDING', label: 'ANTRI', detail: 'Dikirim ulang — menunggu verifikasi', match: null, actual_bet: null, actual_scatter: null })
      .then(function () { toast('Klaim dikirim ulang untuk dicek.', 'ok'); poll(); })
      .catch(function (err) { toast((err && err.message) || 'Gagal kirim ulang.', 'bad'); btn.disabled = false; });
  });

  paintSc();
  loadSites();
  poll();
  setInterval(poll, 4000);
})();
</script>
</body>
</html>
