<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{

  }
  body{font-family:'Inter',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
    background-color:#0b0a08;
    background-image:url('messageImage_1787629523742.jpg');
    background-size:contain;background-position:center;background-repeat:no-repeat;background-attachment:fixed;}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(170deg,rgba(9,8,6,.90),rgba(11,9,7,.80) 45%,rgba(13,11,8,.85) 65%,rgba(8,7,5,.94));}
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;

  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:30px 18px 46px;

    box-shadow:0 0 0 6px rgba(216,180,90,.07),0 0 28px rgba(216,180,90,.20);
    font-family:'Cinzel',serif;font-weight:900;font-size:24px;color:var(--gold2);}
  .crest::after{content:"";position:absolute;inset:5px;border:1px dashed rgba(216,180,90,.34);border-radius:50%;}
  .brand small{display:block;font-size:10px;font-weight:800;letter-spacing:.40em;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
  .brand h1{font-family:'Cinzel',serif;font-weight:900;font-size:34px;letter-spacing:.10em;color:var(--ink);}
  .brand .slo{margin-top:9px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;
    background:rgba(216,180,90,.10);border:1px solid rgba(216,180,90,.25);border-radius:999px;
    display:inline-block;padding:7px 16px;}

  .card{position:relative;background:linear-gradient(180deg,rgba(20,17,12,.92),rgba(11,9,7,.96));
    border:1px solid var(--line);border-radius:18px;padding:26px 26px 28px;
    box-shadow:0 24px 56px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(7px);}
  .card::before,.card::after{content:"";position:absolute;width:32px;height:32px;pointer-events:none;}

  .card::after{bottom:-1px;right:-1px;border-bottom:3px solid rgba(216,180,90,.6);border-right:3px solid rgba(216,180,90,.6);border-bottom-right-radius:18px;}
  .stage{display:none;}
  .stage.active{display:block;animation:viewIn .4s cubic-bezier(.22,.61,.36,1);}
  @keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .pt{text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:20px;letter-spacing:.08em;color:var(--ink);margin-bottom:22px;}
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
  label{font-size:10px;font-weight:800;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;}
  input,select{width:100%;background:rgba(15,13,10,.9);border:1px solid var(--line);border-radius:11px;color:var(--ink);
    padding:14px 15px;font-size:14.5px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s;}
  input::placeholder{color:#7d7260;}

  .money{position:relative;}

  .scatter button.sel small{color:var(--gold);}
  .btn{position:relative;overflow:hidden;border:none;cursor:pointer;width:100%;
    font-family:'Cinzel',serif;font-weight:900;font-size:14px;letter-spacing:.22em;text-transform:uppercase;
    padding:17px 28px;border-radius:12px;color:#1c1404;
    background:linear-gradient(160deg,var(--gold2),var(--gold) 55%,#b98f2e);
    box-shadow:0 8px 30px rgba(216,180,90,.28),inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .16s,box-shadow .25s;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(216,180,90,.4);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .btn .shine{position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);}
  .btn:hover .shine{animation:shine .8s ease;}
  @keyframes shine{to{left:120%;}}
  .btn.ghost{background:rgba(15,13,10,.9);border:1px solid var(--line);color:var(--soft);box-shadow:none;margin-top:12px;padding:13px 20px;font-size:11px;letter-spacing:.16em;}
