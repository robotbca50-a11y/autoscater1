<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BANDAR80 — Klaim Bonus Scatter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --ink:#f5ecd9;--soft:#d9cdb4;--muted:#b3a68c;
    --gold:#d8b45a;--gold2:#e8c96a;
    --line:rgba(216,180,90,.30);--line2:rgba(216,180,90,.45);
    --green:#57c98d;--red:#ef6a6a;--blue:#8db0f2;
  }
  body{font-family:'Inter',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
    background-color:#0b0a08;
    background-image:url('messageImage_1787629523742.jpg');
    background-size:contain;background-position:center;background-repeat:no-repeat;background-attachment:fixed;}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(170deg,rgba(9,8,6,.90),rgba(11,9,7,.80) 45%,rgba(13,11,8,.85) 65%,rgba(8,7,5,.94));}
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 40%,transparent 45%,rgba(0,0,0,.5));}
  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:30px 18px 46px;
    opacity:0;transform:translateY(14px);animation:rise .6s cubic-bezier(.22,.61,.36,1) forwards;}
  @keyframes rise{to{opacity:1;transform:none}}

  header{text-align:center;margin-bottom:22px;}
  .crest{position:relative;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;
    background:radial-gradient(circle at 30% 25%,#3a2f14,#0e0b06 72%);
    border:1px solid var(--line2);
    box-shadow:0 0 0 6px rgba(216,180,90,.07),0 0 28px rgba(216,180,90,.20);
    font-family:'Cinzel',serif;font-weight:900;font-size:24px;color:var(--gold2);}
  .crest::after{content:"";position:absolute;inset:5px;border:1px dashed rgba(216,180,90,.34);border-radius:50%;}
  .brand small{display:block;font-size:10px;font-weight:800;letter-spacing:.40em;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
  .brand h1{font-family:'Cinzel',serif;font-weight:900;font-size:34px;letter-spacing:.10em;color:var(--ink);}
  .brand .slo{margin-top:9px;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;
    background:rgba(216,180,90,.10);border:1px solid rgba(216,180,90,.25);border-radius:999px;
    display:inline-block;padding:7px 16px;}

  .card{position:relative;background:linear-gradient(180deg,rgba(20,17,12,.92),rgba(11,9,7,.96));
    border:1px solid var(--line);border-radius:18px;padding:26px 26px 28px;
    box-shadow:0 24px 56px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(7px);}
  .card::before,.card::after{content:"";position:absolute;width:32px;height:32px;pointer-events:none;}
  .card::before{top:-1px;left:-1px;border-top:3px solid var(--gold);border-left:3px solid var(--gold);border-top-left-radius:18px;}
  .card::after{bottom:-1px;right:-1px;border-bottom:3px solid rgba(216,180,90,.6);border-right:3px solid rgba(216,180,90,.6);border-bottom-right-radius:18px;}
  .stage{display:none;}
  .stage.active{display:block;animation:viewIn .4s cubic-bezier(.22,.61,.36,1);}
  @keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .pt{text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:20px;letter-spacing:.08em;color:var(--ink);margin-bottom:22px;}
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
  label{font-size:10px;font-weight:800;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;}
  input,select{width:100%;background:rgba(15,13,10,.9);border:1px solid var(--line);border-radius:11px;color:var(--ink);
    padding:14px 15px;font-size:14.5px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s;}
  input::placeholder{color:#7d7260;}
  input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,180,90,.14),0 0 22px rgba(216,180,90,.08);}
  select option{background:#14110c;color:var(--ink);}
  .scatter{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .scatter button{position:relative;overflow:hidden;border:1px solid var(--line);background:rgba(15,13,10,.9);color:var(--soft);
    border-radius:11px;padding:15px 8px;font-family:'Cinzel',serif;font-weight:800;font-size:17px;cursor:pointer;
    transition:all .18s;}
  .scatter button small{display:block;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:800;color:var(--muted);margin-top:3px;letter-spacing:.18em;}
  .scatter button:hover{border-color:var(--line2);transform:translateY(-1px);}
  .scatter button.sel{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 3px rgba(216,180,90,.14),0 6px 20px rgba(0,0,0,.4);}
  .scatter button.sel small{color:var(--gold);}
  .btn{position:relative;overflow:hidden;border:none;cursor:pointer;width:100%;
    font-family:'Cinzel',serif;font-weight:900;font-size:14px;letter-spacing:.22em;text-transform:uppercase;
    padding:17px 28px;border-radius:12px;color:#1c1404;
    background:linear-gradient(160deg,var(--gold2),var(--gold) 55%,#b98f2e);
    box-shadow:0 8px 30px rgba(216,180,90,.28),inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .16s,box-shadow .25s;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(216,180,90,.4);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .btn .shine{position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);}
  .btn:hover .shine{animation:shine .8s ease;}
  @keyframes shine{to{left:120%;}}
  .btn.ghost{background:rgba(15,13,10,.9);border:1px solid var(--line);color:var(--soft);box-shadow:none;margin-top:12px;padding:13px 20px;font-size:11px;letter-spacing:.16em;}
  .btn.ghost:hover{color:var(--ink);border-color:var(--line2);}

  .link-home{display:block;text-align:center;margin-top:16px;font-size:12px;color:var(--muted);letter-spacing:.04em;}
  .link-home b{color:var(--gold);}
  .sub{text-align:center;margin-top:18px;font-size:11px;color:var(--muted);line-height:1.8;letter-spacing:.02em;}

  /* hasil lacak */
  .rows{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
  .row{background:rgba(16,13,10,.86);border:1px solid var(--line);border-left:3px solid var(--gold);
    border-radius:12px;padding:13px 15px;animation:rowIn .3s cubic-bezier(.22,.61,.36,1);}
  @keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row .rt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .row .who{font-weight:800;font-size:13px;color:var(--ink);}
  .row .time{margin-left:auto;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;}
  .row .rm{margin-top:7px;font-family:'Inter',monospace;font-size:11.5px;letter-spacing:.03em;color:var(--soft);word-break:break-all;}
  .row .rg{display:flex;gap:20px;margin-top:7px;flex-wrap:wrap;}
  .row .kv{font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:800;}
  .row .kv b{color:var(--ink);font-weight:800;text-transform:none;letter-spacing:0;font-size:13px;font-variant-numeric:tabular-nums;}
  .row .rd{margin-top:7px;font-size:11.5px;color:var(--soft);line-height:1.5;}
  .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
    font-size:9.5px;font-weight:900;letter-spacing:.1em;white-space:nowrap;}
  .tag i{width:5px;height:5px;border-radius:50%;background:currentColor;}
  .tag.pul{background:rgba(141,176,242,.95);color:#0c1730;}
  .tag.vrf{background:rgba(216,180,90,.95);color:#241a04;}
  .tag.ok{background:rgba(87,201,141,.95);color:#052016;}
  .tag.gagal{background:rgba(239,106,106,.95);color:#2b0606;}
  .tag.err{background:rgba(255,143,143,.98);color:#2b0606;}
  .tag.act{animation:throbPulse 1.25s ease-in-out infinite;}
  @keyframes throbPulse{0%,100%{opacity:1}50%{opacity:.6}}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,130%);z-index:40;
    background:rgba(13,11,8,.98);border:1px solid var(--line2);border-radius:12px;
    padding:14px 22px;font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.03em;
    box-shadow:0 14px 44px rgba(0,0,0,.6);text-align:center;max-width:min(90vw,520px);
    transition:transform .4s cubic-bezier(.22,.61,.36,1);}
  .toast.show{transform:translate(-50%,0);}
  .toast.ok{border-color:rgba(87,201,141,.55);} .toast.ok::before{content:"✓ ";}
  .toast.bad{border-color:rgba(239,106,106,.55);} .toast.bad::before{content:"✗ ";}
  .toast.info::before{content:"— ";}

  .foot{margin-top:26px;text-align:center;font-size:10px;color:#8d816c;letter-spacing:.14em;}
  .foot b{color:var(--gold);}
  @media(max-width:900px){body{background-position:center 0;}}

  /* responsif: tablet & HP */
  @media(max-width:640px){
    .wrap{width:100%;padding:18px 12px 34px;}
    .brand h1{font-size:27px;letter-spacing:.08em;}
    .brand .slo{font-size:10px;padding:6px 13px;}
    .crest{width:56px;height:56px;font-size:20px;}
    .card{padding:20px 16px 22px;border-radius:16px;}
    .pt{font-size:18px;margin-bottom:18px;}
    input,select{font-size:16px;padding:13px 14px;}
    .scatter button{padding:13px 6px;font-size:15px;}
    .btn{width:100%;padding:15px 18px;font-size:13px;}
    .row .rg{gap:12px;}
  }
  @media(max-width:380px){.brand h1{font-size:23px;} .scatter{grid-template-columns:repeat(3,1fr);gap:7px;}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crest">B</div>
    <div class="brand">
      <small>Klaim Bonus Scatter</small>
      <h1>BANDAR80</h1>
      <div class="slo">Proses cepat · 5 menit pasti masuk</div>
    </div>
  </header>

  <div class="card">
    <!-- ===== FORM KLAIM ===== -->
    <div class="stage active" id="stage-form">
      <div class="pt">Kirim Tiket Scatter</div>
      <div class="field">
        <label>Situs</label>
        <select id="f_site"><option value="">Memuat situs...</option></select>
      </div>
      <div class="field">
        <label>User ID</label>
        <input id="f_user" placeholder="Isi user id kamu" autocomplete="off">
      </div>
      <div class="field">
        <label>Kode Tiket</label>
        <input id="f_tx" placeholder="2081566454871960576" inputmode="numeric" autocomplete="off">
      </div>
      <div class="field">
        <label>Nominal Bet</label>
        <input id="f_bet" placeholder="50000" inputmode="numeric" autocomplete="off">
      </div>
      <div class="field">
        <label>Jumlah Scatter</label>
        <div class="scatter" id="scSel">
          <button type="button" data-v="3">x3<small>TIGA</small></button>
          <button type="button" data-v="4">x4<small>EMPAT</small></button>
          <button type="button" data-v="5">x5<small>LIMA</small></button>
        </div>
      </div>
      <button class="btn" id="btnSubmit"><span class="shine"></span>Kirim tiket scatter</button>
      <div class="link-home">Sudah pernah mengirim klaim? <b id="goTrack">Cek status klaim</b></div>
    </div>

    <!-- ===== LACAK KLAIM ===== -->
    <div class="stage" id="stage-track">
      <div class="pt">Lacak Klaim Anda</div>
      <div class="field">
        <label>User ID</label>
        <input id="t_user" placeholder="Isi user id kamu" autocomplete="off">
      </div>
      <button class="btn" id="btnTrack"><span class="shine"></span>Lacak</button>
      <div id="trackRows" class="rows"></div>
      <button class="btn ghost" id="goForm">Kembali ke form klaim</button>
    </div>
  </div>

  <div class="foot">AUTO CEK SCATER LIVE — <b>v1.6.0</b></div>
</div>

<div class="toast" id="toast"></div>
