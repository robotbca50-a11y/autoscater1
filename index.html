  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;

  .crest::after{content:"";position:absolute;inset:5px;border:1px dashed rgba(216,180,90,.34);border-radius:50%;}

    background:linear-gradient(160deg,var(--gold2),var(--gold) 55%,#b98f2e);

    transition:transform .16s,box-shadow .25s;}

  @keyframes shine{to{left:120%;}}
